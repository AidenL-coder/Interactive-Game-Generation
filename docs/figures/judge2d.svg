<svg xmlns="http://www.w3.org/2000/svg" width="440pt" height="230pt" viewBox="0 0 440 230">
  <!--
    Play-and-judge evaluation, 2D renderer. Drawn at 440pt wide so text stays >= 7pt
    whether it is set at NeurIPS text width (396pt, x0.90) or ICML figure* width (487pt,
    x1.11). Okabe-Ito hues for colour-blind safety; every box is also labelled, so the
    figure survives greyscale printing.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrowBlocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D55E00"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1F2937; }
      .title { font-size: 8.6px; font-weight: 700; }
      .model { font-size: 7.4px; font-weight: 400; fill: #6B7280; }
      .body  { font-size: 7.2px; }
      .dim   { font-size: 7px; fill: #6B7280; }
      .lab   { font-size: 7px; fill: #374151; font-style: italic; }
      .mono  { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 6.6px; fill: #374151; }
      .arrow { stroke: #4B5563; stroke-width: 0.9; fill: none; }
    </style>
  </defs>

  <!-- ============ GAME ============ -->
  <rect x="4" y="6" width="94" height="218" rx="4" fill="#F5F5F4" stroke="#6B7280" stroke-width="0.9"/>
  <text class="title" x="51" y="17.5" text-anchor="middle">Generated game</text>

  <!-- (1) the live screen: a miniature of the actual 2D UI -->
  <g>
    <rect x="12" y="24" width="78" height="44" rx="1.5" fill="#26314F"/>
    <rect x="12" y="51" width="78" height="17" fill="#D9CFB8"/>
    <rect x="12" y="24" width="78" height="44" rx="1.5" fill="none" stroke="#111827" stroke-width="0.6"/>
    <!-- cut-out figures standing on the ground plane -->
    <rect x="24" y="40" width="6" height="15" rx="2.5" fill="#8B5E3C"/>
    <rect x="41" y="36" width="8" height="20" rx="3" fill="#C9A227"/>
    <rect x="60" y="43" width="5" height="11" rx="2" fill="#7C8794"/>
    <!-- objective card, narrative band, choice buttons -->
    <rect x="14" y="26" width="20" height="6.5" rx="1" fill="#0B1020" opacity="0.75"/>
    <rect x="14" y="58" width="38" height="8" rx="1" fill="#0B1020" opacity="0.7"/>
    <rect x="16" y="60" width="32" height="1" fill="#E5E7EB"/>
    <rect x="16" y="63" width="26" height="1" fill="#E5E7EB"/>
    <rect x="62" y="52" width="26" height="4" rx="0.8" fill="#0B1020" opacity="0.8"/>
    <rect x="62" y="57" width="26" height="4" rx="0.8" fill="#0B1020" opacity="0.8" stroke="#E69F00" stroke-width="0.5"/>
    <rect x="62" y="62" width="26" height="4" rx="0.8" fill="#0B1020" opacity="0.8"/>
  </g>
  <text class="dim" x="51" y="77.5" text-anchor="middle">live screen</text>

  <line x1="10" y1="86" x2="92" y2="86" stroke="#D1D5DB" stroke-width="0.6" stroke-dasharray="2 2"/>

  <!-- (2) the decision frames saved for the judge -->
  <g>
    <rect x="32" y="102" width="46" height="26" rx="1.2" fill="#26314F" stroke="#9CA3AF" stroke-width="0.5"/>
    <rect x="28" y="106" width="46" height="26" rx="1.2" fill="#26314F" stroke="#9CA3AF" stroke-width="0.5"/>
    <rect x="24" y="110" width="46" height="26" rx="1.2" fill="#26314F" stroke="#4B5563" stroke-width="0.6"/>
    <rect x="24" y="126" width="46" height="10" fill="#D9CFB8"/>
    <rect x="34" y="118" width="4" height="10" rx="1.6" fill="#8B5E3C"/>
    <rect x="46" y="115" width="5" height="13" rx="2" fill="#C9A227"/>
  </g>
  <text class="dim" x="51" y="146.5" text-anchor="middle">saved frames, 1 per turn</text>

  <line x1="10" y1="156" x2="92" y2="156" stroke="#D1D5DB" stroke-width="0.6" stroke-dasharray="2 2"/>

  <!-- (3) the game state, which neither agent ever sees -->
  <text class="dim" x="51" y="167" text-anchor="middle">game state (DOM)</text>
  <rect x="12" y="172" width="78" height="44" rx="2" fill="#E7E5E4"/>
  <text class="mono" x="16" y="184">progress 45%</text>
  <text class="mono" x="16" y="195">sentence "7 words"</text>
  <text class="mono" x="16" y="206">keeper   "brisk"</text>

  <!-- ============ GAME -> AGENTS ============ -->
  <line class="arrow" x1="98" y1="31" x2="149" y2="31" marker-end="url(#arrow)"/>
  <text class="lab" x="123.5" y="27.5" text-anchor="middle">screenshot</text>

  <line class="arrow" x1="149" y1="50" x2="99" y2="50" marker-end="url(#arrow)"/>
  <text class="lab" x="123.5" y="46.5" text-anchor="middle">action</text>
  <text class="dim" x="123.5" y="62" text-anchor="middle">↻ each turn</text>

  <line class="arrow" x1="98" y1="123" x2="149" y2="123" marker-end="url(#arrow)"/>
  <text class="lab" x="123.5" y="119.5" text-anchor="middle">frames</text>

  <line class="arrow" x1="98" y1="195" x2="149" y2="195" marker-end="url(#arrow)"/>
  <text class="lab" x="123.5" y="191.5" text-anchor="middle">DOM state</text>

  <!-- ============ PLAYER ============ -->
  <rect x="150" y="6" width="150" height="64" rx="4" fill="#EAF3FA" stroke="#0072B2" stroke-width="1"/>
  <text x="157" y="18.5"><tspan class="title" style="fill:#0072B2">Player</tspan><tspan class="model" dx="4">Claude Sonnet 5</tspan></text>
  <text class="body" x="157" y="31">sees: screenshot + notes on last 5 turns</text>
  <text class="body" x="157" y="43">writes: reading → want → ratings → action</text>
  <text class="body" x="157" y="55">acts: choose · click · walk · dismiss</text>
  <text class="dim" x="157" y="65.5">plays for fun; never told it is evaluating</text>

  <!-- the one channel that is deliberately cut -->
  <line x1="225" y1="71" x2="225" y2="88.5" stroke="#D55E00" stroke-width="0.9" stroke-dasharray="2 1.6" marker-end="url(#arrowBlocked)"/>
  <path d="M221.5,76.5 L228.5,83.5 M228.5,76.5 L221.5,83.5" stroke="#D55E00" stroke-width="1.2" stroke-linecap="round"/>
  <text x="233" y="82.5" style="font-size:7px; fill:#D55E00; font-weight:700">ratings withheld</text>

  <!-- ============ JUDGE ============ -->
  <rect x="150" y="90" width="150" height="66" rx="4" fill="#FDF4E1" stroke="#C98A00" stroke-width="1"/>
  <text x="157" y="102.5"><tspan class="title" style="fill:#A86F00">Judge</tspan><tspan class="model" dx="4">Claude Opus 5</tspan></text>
  <text class="body" x="157" y="115">sees: saved frames + premise</text>
  <text class="body" x="157" y="127">9 dims × 1–5, evidence before score</text>
  <text class="body" x="157" y="139">visual · experience · writing</text>
  <text class="dim" x="157" y="150.5">"3 is the expected score"</text>

  <!-- ============ MEASURED ============ -->
  <rect x="150" y="166" width="150" height="58" rx="4" fill="#E6F4EE" stroke="#00835F" stroke-width="1"/>
  <text x="157" y="178.5"><tspan class="title" style="fill:#00704F">Measured</tspan><tspan class="model" dx="4">no model</tspan></text>
  <text class="body" x="157" y="191">sees: game state, hidden from agents</text>
  <text class="body" x="157" y="203">counts: which stats moved, progress</text>
  <text class="body" x="157" y="214">reversals, unreadable choices</text>

  <!-- ============ REPORT ============ -->
  <rect x="326" y="6" width="110" height="218" rx="4" fill="#FFFFFF" stroke="#374151" stroke-width="0.9"/>
  <text class="title" x="381" y="17.5" text-anchor="middle">Report</text>

  <rect x="332" y="24" width="98" height="28" rx="3" fill="#FFFFFF" stroke="#0072B2" stroke-width="0.9"/>
  <text class="body" x="381" y="35" text-anchor="middle" style="font-weight:700">live ratings</text>
  <text class="dim" x="381" y="45.5" text-anchor="middle">engagement, samey choices</text>

  <text class="dim" x="381" y="77" text-anchor="middle" style="fill:#374151">⇅ compared</text>
  <text class="dim" x="381" y="86" text-anchor="middle">e.g. agency vs. samey rate</text>

  <rect x="332" y="109" width="98" height="28" rx="3" fill="#FFFFFF" stroke="#C98A00" stroke-width="0.9"/>
  <text class="body" x="381" y="120" text-anchor="middle" style="font-weight:700">rubric scores</text>
  <text class="dim" x="381" y="130.5" text-anchor="middle">+ biggest problem</text>

  <text class="dim" x="381" y="156" text-anchor="middle" style="fill:#374151">⇅ compared</text>
  <text class="dim" x="381" y="165" text-anchor="middle">e.g. stakes vs. stat movement</text>

  <rect x="332" y="181" width="98" height="28" rx="3" fill="#FFFFFF" stroke="#00835F" stroke-width="0.9"/>
  <text class="body" x="381" y="192" text-anchor="middle" style="font-weight:700">measured counts</text>
  <text class="dim" x="381" y="202.5" text-anchor="middle">stats, progress, reads</text>

  <text x="381" y="219" text-anchor="middle" style="font-size:7px; fill:#D55E00; font-weight:700">disagreements flagged</text>
  <!-- ============ AGENTS -> REPORT ============ -->
  <!-- Drawn after the report box: drawn before it, the box's white fill covered the tips. -->
  <line class="arrow" x1="300" y1="38" x2="331.5" y2="38" marker-end="url(#arrow)"/>
  <line class="arrow" x1="300" y1="123" x2="331.5" y2="123" marker-end="url(#arrow)"/>
  <line class="arrow" x1="300" y1="195" x2="331.5" y2="195" marker-end="url(#arrow)"/>
</svg>
